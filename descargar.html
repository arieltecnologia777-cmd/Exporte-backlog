<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Descargando…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,body{margin:0;height:100%;background:#fff}
  </style>
  <script>
    // === CONFIGURACIÓN ===
    // Tu endpoint de Apps Script (ANÓNIMO):
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxVpB4PqDdCvoEWXUKMG9zPZHhKarS7WlWFaG1t5g6Gaq0PNLup2KH4e3ofUDPSRnI/exec';

    // Nombre base deseado:
    const BASE_NAME = 'Exporte backlog';

    // Fecha local (del navegador) en formato AAAA-MM-DD
    function fechaYYYYMMDD() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    async function descargar() {
      try {
        // Evita cache para que siempre baje el contenido más reciente
        const resp = await fetch(ENDPOINT + `?cb=${Date.now()}`, { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);

        // El Apps Script ya entrega el CSV con BOM, ideal para Excel
        const text = await resp.text();
        const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });

        // Nombre final del archivo
        const filename = `${BASE_NAME} - ${fechaYYYYMMDD()}.csv`;

        // Dispara la descarga
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        // Limpia la pestaña (opcional)
        setTimeout(() => { window.location.replace('about:blank'); }, 300);
      } catch (e) {
        document.body.innerHTML = '<div style="font-family:system-ui;padding:16px">Error al descargar: ' + String(e) + '</div>';
      }
    }

    window.addEventListener('load', descargar);
  </script>
</head>
<body></body>
</html>
