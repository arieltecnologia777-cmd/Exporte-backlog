<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Descargando…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,body{margin:0;height:100%;background:#fff}
  </style>
  <script>
    // === ENDPOINT de tu Apps Script (anónimo) ===
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwF7--VxBAFMHmCdsc6E0PR7Ha85MhDQCD_Ybo7im01p8Cl28Pk_xtGh9lHeacTNYtv/exec';

    // Nombre base del archivo
    const BASE_NAME = 'Exporte OTS indicador backlog';

    // Fecha AAAA-MM-DD
    function fechaYYYYMMDD() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    // Detecta si el buffer empieza con BOM UTF-8 (EF BB BF)
    function hasUtf8Bom(uint8) {
      return uint8.length >= 3 &&
             uint8[0] === 0xEF && uint8[1] === 0xBB && uint8[2] === 0xBF;
    }

    async function descargar() {
      try {
        // Evitamos cache para que siempre baje la versión más reciente
        const resp = await fetch(ENDPOINT + `?cb=${Date.now()}`, { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);

        // Trabajamos en bytes para preservar/añadir el BOM
        const buf = await resp.arrayBuffer();
        let bytes = new Uint8Array(buf);

        // Si el CSV no trae BOM, lo agregamos aquí
        if (!hasUtf8Bom(bytes)) {
          const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
          const merged = new Uint8Array(bom.length + bytes.length);
          merged.set(bom, 0);
          merged.set(bytes, bom.length);
          bytes = merged;
        }

        // Blob de tipo CSV con UTF-8 (BOM asegurado)
        const blob = new Blob([bytes], { type: 'text/csv;charset=utf-8' });

        // Nombre final del archivo
        const filename = `${BASE_NAME} - ${fechaYYYYMMDD()}.csv`;

        // Dispara la descarga
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        // Limpia la pestaña (opcional)
        setTimeout(() => { window.location.replace('about:blank'); }, 300);
      } catch (e) {
        document.body.innerHTML = '<div style="font-family:system-ui;padding:16px">Error al descargar: ' + String(e) + '</div>';
      }
    }

    window.addEventListener('load', descargar);
  </script>
</head>
<body></body>
</html>
