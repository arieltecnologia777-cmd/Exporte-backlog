<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Descargando Exporte backlog…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>html,body{margin:0;height:100%;background:#fff}</style>
  <script>
    // ===== CONFIGURACIÓN =====
    // Endpoint del Web App de Apps Script (acceso: "Cualquiera, incluso anónimo")
    const ENDPOINT  = 'https://script.google.com/macros/s/AKfycbzuP3rVdQs9SfX24LpXSlB_yw_M32eswpyIEC8V6A-sncD31h1MYWpCTOoQAlcaOQ/exec';
    const BASE_NAME = 'Exporte backlog';

    // Fecha AAAA-MM-DD
    function fechaYYYYMMDD(){
      const d=new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    // Detecta BOM UTF-8 (EF BB BF)
    function hasUtf8Bom(u8){return u8.length>=3 && u8[0]===0xEF && u8[1]===0xBB && u8[2]===0xBF;}

    async function descargar(){
      try{
        // Cache-busting para asegurar siempre datos frescos
        const resp = await fetch(ENDPOINT + `?cb=${Date.now()}`, { cache:'no-store' });
        if(!resp.ok) throw new Error('HTTP '+resp.status);

        // Trabajamos en bytes para preservar/añadir BOM (garantiza ñ/tildes en Excel)
        const buf = await resp.arrayBuffer();
        let bytes = new Uint8Array(buf);

        if(!hasUtf8Bom(bytes)){
          const bom = new Uint8Array([0xEF,0xBB,0xBF]);
          const merged = new Uint8Array(bom.length + bytes.length);
          merged.set(bom,0); merged.set(bytes,bom.length);
          bytes = merged;
        }

        const blob = new Blob([bytes], { type:'text/csv;charset=utf-8' });
        const filename = `${BASE_NAME} - ${fechaYYYYMMDD()}.csv`;

        // Disparar descarga
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);

        // Cierre / limpieza (según permisos del navegador)
        setTimeout(()=>{
          // Intento estándar
          window.close();
          // Fallback clásico
          try { window.open('','_self'); window.close(); } catch(e) {}
          // Si no se puede cerrar, dejar en blanco
          if (!document.hidden) window.location.replace('about:blank');
        }, 400);

      }catch(e){
        document.body.innerHTML = '<div style="font-family:system-ui;padding:16px">Error al descargar: '+String(e)+'</div>';
      }
    }

    window.addEventListener('load', descargar);
  </script>
</head>
<body></body>
</html>
