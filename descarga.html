<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Descargando…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,body{margin:0;height:100%;background:#fff}
    /* opcional: pantalla en blanco sin nada visible */
  </style>
  <script>
    // === CONFIGURACIÓN ===
    // Tu endpoint /exec de Apps Script:
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzzOmq8JLV67aT8oGGUk3AGlB0Ie1GtTRSXs2rCTtglVR_7kVlAI0qk5KcK3QsT_UU/exec';
    // Nombre base deseado:
    const BASE_NAME = 'Exporte backlog';

    // Fecha local (del navegador)
    function fechaYYYYMMDD() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    async function descargar() {
      try {
        // Traer CSV (con BOM) desde Apps Script
        const resp = await fetch(ENDPOINT, { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);

        const text = await resp.text(); // CSV con BOM
        const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });

        // Nombre final
        const filename = `${BASE_NAME} - ${fechaYYYYMMDD()}.csv`;

        // Dispara descarga
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        // Deja la pestaña en blanco (o intenta cerrar)
        setTimeout(() => { window.location.replace('about:blank'); }, 300);
      } catch (e) {
        document.body.innerHTML = '<div style="font-family:system-ui;padding:16px">Error al descargar: ' + String(e) + '</div>';
      }
    }

    window.addEventListener('load', descargar);
  </script>
</head>
<body></body>
</html>
